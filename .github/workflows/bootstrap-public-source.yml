# One-shot import for the audited APEX 0.5.1 corresponding-source archive.
# Upload SOURCE.zip to the repository root before adding this workflow at
# .github/workflows/bootstrap-public-source.yml. It deletes the temporary
# SOURCE.zip in its import commit; it does not build or run the imported code.
# Delete this workflow through GitHub after the import succeeds. Leaving its
# own file untouched avoids requiring permission to modify workflow files.
name: Import audited APEX 0.5.1 source once

on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-public-source.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: apex-public-source-bootstrap
  cancel-in-progress: false

jobs:
  import-source:
    if: github.repository == 'arthurjorgefacul-byte/apex-race-engineer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out this repository
        # Official v4.2.2 tag, verified against its GitHub release/commit page.
        # https://github.com/actions/checkout/releases/tag/v4.2.2
        # https://github.com/actions/checkout/commit/11bd71901bbe5b1630ceea73d27597364c9af683
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Verify and import the fixed public source archive
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          archive = root / 'SOURCE.zip'
          expected_sha256 = '080f111cdfb47b5c1641818683ced55935494df8467035cb5a44bca92e96d4f4'
          expected_names_sha256 = '09f308c0cd5a5679375d42918147809ef158f710c4ffb76949b80a222cabd771'
          if not archive.is_file() or archive.is_symlink():
              raise SystemExit('Upload the audited SOURCE.zip to the repository root first.')
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected_sha256:
              raise SystemExit('SOURCE.zip is not the audited APEX 0.5.1 archive; nothing imported.')

          allowed_directories = {
              'ac_app', 'assets', 'csp_app', 'desktop', 'docs', 'engineer',
              'playtest', 'reference_data', 'tests', 'third_party', 'web',
          }
          allowed_root_files = {
              'app.py', 'CONTRACT.md', 'Create Desktop Shortcut.cmd',
              'Create Desktop Shortcut.ps1', 'CREDITS.md', 'Install Overlay.cmd',
              'Install Overlay.ps1', 'LICENSE', 'PERFORMANCE.md', 'README.md',
              'Restore performance settings.cmd', 'Restore performance settings.ps1',
              'Start Race Engineer.cmd', 'Start.cmd', 'Start.ps1', 'VALIDATION.md',
          }
          required = {
              'app.py', 'LICENSE', 'CREDITS.md', 'README.md',
              'desktop/ApexDesktop.csproj', 'desktop/MainForm.cs',
              'engineer/telemetry.py', 'engineer/live_engineer.py',
              'ac_app/RaceEngineer/RaceEngineer.py',
              'csp_app/ApexBridge/ApexBridge.lua',
              'third_party/pro_engineer/pro-engineer-v0.5.1-source.tar.gz',
              'third_party/pro_engineer/PROVENANCE.json',
          }
          with zipfile.ZipFile(archive) as source:
              entries = source.infolist()
              names = [entry.filename for entry in entries]
              names_hash = hashlib.sha256(('\n'.join(sorted(names)) + '\n').encode()).hexdigest()
              if (len(entries) != 118 or names_hash != expected_names_sha256
                      or sum(entry.file_size for entry in entries) != 11115645
                      or not required.issubset(names)):
                  raise SystemExit('The archive does not have the audited 118-file source manifest.')
              seen = set()
              payloads = {}
              for entry in entries:
                  name = entry.filename
                  parts = name.split('/')
                  relative = PurePosixPath(name)
                  mode = stat.S_IFMT(entry.external_attr >> 16)
                  if (entry.is_dir() or relative.is_absolute() or '\\' in name
                          or ':' in name or '\x00' in name
                          or any(part in ('', '.', '..') for part in parts)
                          or any(part.lower() in ('.git', '.github') for part in parts)
                          or mode not in (0, stat.S_IFREG)
                          or name.casefold() in seen):
                      raise SystemExit(f'Unsafe or duplicate archive entry: {name!r}')
                  if ((len(parts) == 1 and name not in allowed_root_files)
                          or (len(parts) > 1 and parts[0] not in allowed_directories)):
                      raise SystemExit(f'Unexpected source path: {name!r}')
                  seen.add(name.casefold())
                  destination = root.joinpath(*parts)
                  if not destination.resolve().is_relative_to(root):
                      raise SystemExit(f'Archive path escapes the checkout: {name!r}')
                  for parent in (destination, *destination.parents):
                      if parent == root:
                          break
                      if parent.is_symlink():
                          raise SystemExit(f'Symlink already present at destination: {name!r}')
                  payloads[name] = source.read(entry)  # CRC checked before any writes.

          readme = root / 'README.md'
          release_prefix = 'https://github.com/arthurjorgefacul-byte/apex-race-engineer/releases'
          preserve_readme = readme.is_file() and release_prefix in readme.read_text(encoding='utf-8')
          for name, data in payloads.items():
              if name == 'README.md' and preserve_readme:
                  continue
              destination = root.joinpath(*PurePosixPath(name).parts)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)

          # These fixed publication helpers were reviewed with the source package.
          extras = {
              '.gitignore': '''/data/
          **/__pycache__/
          **/bin/
          **/obj/
          *.pyc
          *.pdb
          *.sqlite3*
          *.log
          .env
          .env.*
          APEX-session-*.json
          /Apex.exe
          /Apex.dll
          /Apex.deps.json
          /Apex.runtimeconfig.json
          /SOURCE.zip
          /RELEASE.json
          ''',
              '.github/ISSUE_TEMPLATE/playtest-feedback.md': '''---
          name: Playtest feedback
          about: Report a problem or a useful coaching example from an APEX playtest
          title: "[Playtest] "
          labels: ""
          assignees: ""
          ---

          **APEX version:**

          **Windows / CSP version:**

          **Car and exact track/layout:**

          **Practice / qualifying / race; offline / online:**

          **Wheel/button and voice-input setup, if relevant:**

          **What happened, and what did you expect?**

          **Steps to reproduce:**

          1.
          2.
          3.

          **Was the advice helpful? What should be clearer?**

          **Optional screenshot, relevant log excerpt or selected-session export:**

          Please review attachments before posting. Share only relevant evidence you choose; the full recordings folder is unnecessary. Do not include account details, private tokens or unrelated files.
          ''',
          }
          for name, text in extras.items():
              destination = root.joinpath(*PurePosixPath(name).parts)
              if not destination.resolve().is_relative_to(root):
                  raise SystemExit(f'Publication helper path escapes checkout: {name!r}')
              for parent in (destination, *destination.parents):
                  if parent == root:
                      break
                  if parent.is_symlink():
                      raise SystemExit(f'Symlink at publication helper destination: {name!r}')
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(text, encoding='utf-8')

          # Fixed, scoped temporary path only; the workflow remains untouched.
          archive.unlink()
          print('Imported the audited 118-file APEX 0.5.1 source and two publication helpers.')
          print('Removed temporary SOURCE.zip. Delete the bootstrap workflow through GitHub after success.')
          print(f'Preserved existing README with public release link: {preserve_readme}')
          PY

      - name: Commit the corresponding public source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- .
          git diff --cached --stat
          git commit -m 'Import audited APEX 0.5.1 corresponding source'
          git push origin HEAD:main

